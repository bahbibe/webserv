name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: build + unit + e2e tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libssl-dev curl python3

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build -j4

      - name: Unit tests (doctest via ctest)
        run: ctest --test-dir build --output-on-failure

      - name: End-to-end tests
        run: tests/run_tests.sh

  sanitize:
    name: ASan + UBSan build + e2e tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libssl-dev curl python3

      - name: Configure with sanitizers
        run: cmake -S . -B build -DWEBSERV_SANITIZE=ON -DWEBSERV_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build -j4

      - name: End-to-end tests under ASan/UBSan
        env:
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: tests/run_tests.sh

  static-analysis:
    name: cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck

      - name: Run cppcheck
        run: |
          cppcheck --enable=warning,performance,portability --error-exitcode=1 \
            --inline-suppr --suppress=missingIncludeSystem \
            -I inc src main.cpp

  format-check:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format

      # Advisory, not a hard gate: the existing tree predates this
      # workflow and isn't fully reformatted to .clang-format yet
      # (a repo-wide reformat is its own, separately-reviewed change,
      # not something to fold silently into an unrelated CI PR).
      # --dry-run alone always exits 0 (only -Werror would fail the
      # step) - check its output instead of its exit code.
      - name: Check formatting
        run: |
          clang-format --dry-run -style=file \
            $(find src inc tests/fuzz -name '*.cpp' -o -name '*.hpp') main.cpp \
            2>/tmp/format-diff.log
          cat /tmp/format-diff.log
          if [ -s /tmp/format-diff.log ]; then
            echo "::warning::formatting drift found - see job log"
          fi

  fuzz-smoke:
    name: fuzz smoke test (chunked + multipart body parsers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake libssl-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++ -DWEBSERV_FUZZ=ON -DWEBSERV_BUILD_TESTS=OFF

      - name: Build fuzz targets
        run: cmake --build build --target fuzz_chunks fuzz_boundaries -j4

      # A short timed run on every push/PR, not a continuous fuzzing
      # campaign - catches an obvious new crash close to the change
      # that caused it. Longer, ongoing fuzzing is a manual/local
      # thing (each harness's own header comment).
      - name: Run fuzz_chunks for 60s
        run: ./build/fuzz_chunks -max_total_time=60 -print_final_stats=1

      - name: Run fuzz_boundaries for 60s
        run: ./build/fuzz_boundaries -max_total_time=60 -print_final_stats=1

  docker-scan:
    name: Docker image vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t webserv:ci .

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: webserv:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
